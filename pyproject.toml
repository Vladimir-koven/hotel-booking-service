[project]
name = "hotel-booking-service"
version = "0.1.0"
description = "Hotel Room and Booking Management Service"
authors = [
    {name = "Владимир", email = "vova.yagubec@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=5.0.0,<6.0.0",
    "djangorestframework>=3.15.0,<4.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "dynaconf>=3.2.0,<4.0.0",
    "python-decouple>=3.8.0,<4.0.0",
    "loguru>=0.7.3,<1.0.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "redis>=5.0.0,<6.0.0",
    "django-redis>=5.4.0,<6.0.0",
    "dj-database-url>=3.1.2,<4.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.0,<0.17.0"
mypy = ">=2.3.0,<3.0.0"
bandit = ">=1.9.4,<2.0.0"
radon = ">=6.0.1,<7.0.0"
pre-commit = ">=4.6.1,<5.0.0"
pytest = ">=9.1.1,<10.0.0"
pytest-django = ">=4.12.0,<5.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-xdist = ">=3.8.0,<4.0.0"
factory-boy = ">=3.3.3,<4.0.0"
faker = ">=40.36.0,<41.0.0"
django-stubs = ">=6.0.7,<7.0.0"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = "apps.*.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "config.settings"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "apps", "config", "utils"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B311"]
severity = "medium"
confidence = "medium"

[tool.radon]
min_cc = 10
min_mi = 20
ignore = ["tests", "migrations"]
