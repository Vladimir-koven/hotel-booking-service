[project]
name = "hotel-booking-service"
version = "0.1.0"
description = "Hotel Room and Booking Management Service"
authors = [
    {name = "Владимир", email = "vova.yagubec@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "django>=5.0.0,<6.0.0",
    "djangorestframework>=3.15.0,<4.0.0",
]

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = "apps.*.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "config.settings"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "apps", "config", "utils"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
